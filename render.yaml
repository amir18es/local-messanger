services:
  - type: web
    name: local-messenger-secure
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: local-messenger-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        value: مدیر سیستم
      - key: MAX_FILE_MB
        value: "15"

databases:
  - name: local-messenger-db
    databaseName: local_messenger
    user: messenger_user
    plan: free
    postgresMajorVersion: "16"
